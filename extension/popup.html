<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pravq go</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      width: 280px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
    }
    .logo {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: #c9a55c;
      color: #09090b;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      background: #121214;
      color: #d4d4d8;
      border: 1px solid #27272a;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
      text-align: left;
    }
    button:hover {
      background: #18181b;
      border-color: rgba(201, 165, 92, 0.4);
      color: #ffffff;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    .btn-arrow {
      color: #c9a55c;
      font-size: 11px;
    }
    .status {
      font-size: 11px;
      color: #71717a;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">P</div>
    <h1>pravq go</h1>
  </div>
  <div class="btn-group">
    <button id="openSidePanel">Open Canvas (Side Panel) <span class="btn-arrow">→</span></button>
    <button id="openNewTab">Open Canvas (New Tab) <span class="btn-arrow">→</span></button>
    <button id="openOptions">Settings <span class="btn-arrow">→</span></button>
    <button id="backupNow">Backup Now <span class="btn-arrow">⚡</span></button>
    <button id="pushRemote">Push to Remote <span class="btn-arrow">☁</span></button>
  </div>
  <div class="status">
    <span>Status</span>
    <div class="status-info">
      <span class="status-dot"></span>
      <span id="status" style="color: #a1a1aa;">Ready</span>
    </div>
  </div>

  <script>
    document.getElementById('openSidePanel').addEventListener('click', () => {
      chrome.sidePanel.open({ windowId: chrome.windows.WINDOW_ID_CURRENT });
    });
    document.getElementById('openNewTab').addEventListener('click', () => {
      chrome.tabs.create({ url: 'newtab.html' });
    });
    document.getElementById('openOptions').addEventListener('click', () => {
      chrome.runtime.openOptionsPage();
    });
    document.getElementById('backupNow').addEventListener('click', async () => {
      await chrome.runtime.sendMessage({ type: 'CREATE_BACKUP' });
      document.getElementById('status').textContent = 'Local backup created';
    });
    document.getElementById('pushRemote').addEventListener('click', async () => {
      const statusText = document.getElementById('status');
      statusText.textContent = 'Syncing...';
      const res = await chrome.runtime.sendMessage({ type: 'PUSH_REMOTE' });
      statusText.textContent = res.ok ? 'Pushed to remote' : ('Failed: ' + (res.error || 'unknown'));
    });
  </script>
</body>
</html>
